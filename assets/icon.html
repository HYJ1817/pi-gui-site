<!DOCTYPE html>
<html lang="zh-CN">
<!-- 图标源文件：由 tools/gen-assets.mjs 截图输出 apple-touch-icon.png（180²）与 favicon.png（64²）。 -->
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  .tile {
    width: 180px; height: 180px; border-radius: 40px;
    background: #16161a; display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .pi { font-family: Georgia, "Times New Roman", serif; font-size: 108px; line-height: 1; color: #fafaf7; padding-bottom: 14px; }
</style>
</head>
<body style="background:#333;width:180px;height:180px">
  <div class="tile">
    <span class="pi">π</span>
  </div>
</body>
</html>
